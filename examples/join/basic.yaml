# KasprJoin Basic Example
# This example demonstrates a key join between an orders table and a products table.
# Two agents fill the tables from their topics; the join produces an output channel
# that a third agent consumes to create enriched orders.
#
# Prerequisites:
#   - A KasprApp named "order-system" must exist
#   - Kafka topics "raw-orders" and "raw-products" must exist, each with the tables'
#     partition count (6), their records keyed by order_id and product_id as plain
#     strings, partitioned by Kafka's default partitioner
#
# Usage:
#   kubectl apply -f examples/join/basic.yaml
#   kubectl get kjoin
#   kubectl describe kjoin orders-products-join
#
# KasprJoins reach the app's pods only with definitions bundle delivery: annotate the
# KasprApp "kaspr.io/definitions-delivery: bundle" (docs/user-guide/definitions-delivery.md).
#
# A joined table must be keyed like the topic that fills it: here both are raw, the
# keys as produced. The app refuses to start when they differ.

---
# Orders table (keyed by order_id)
apiVersion: kaspr.io/v1alpha1
kind: KasprTable
metadata:
  name: orders
  labels:
    kaspr.io/app: order-system
spec:
  name: orders
  description: "Orders keyed by order_id"
  partitions: 6
  keySerializer: raw

---
# Products table (keyed by product_id)
apiVersion: kaspr.io/v1alpha1
kind: KasprTable
metadata:
  name: products
  labels:
    kaspr.io/app: order-system
spec:
  name: products
  description: "Product catalog keyed by product_id"
  partitions: 6
  keySerializer: raw

---
# Fills the orders table from raw-orders
apiVersion: kaspr.io/v1alpha1
kind: KasprAgent
metadata:
  name: ingest-orders
  labels:
    kaspr.io/app: order-system
spec:
  description: "Stores each order under its record's key"
  input:
    topic:
      name: raw-orders
      keySerializer: raw
  processors:
    pipeline:
      - store
    operations:
      - name: store
        tables:
          - name: orders
            paramName: orders
        map:
          entrypoint: store
          python: |
            def store(value, orders):
                orders[context["event"].key] = value
                return value

---
# Fills the products table from raw-products
apiVersion: kaspr.io/v1alpha1
kind: KasprAgent
metadata:
  name: ingest-products
  labels:
    kaspr.io/app: order-system
spec:
  description: "Stores each product under its record's key"
  input:
    topic:
      name: raw-products
      keySerializer: raw
  processors:
    pipeline:
      - store
    operations:
      - name: store
        tables:
          - name: products
            paramName: products
        map:
          entrypoint: store
          python: |
            def store(value, products):
                products[context["event"].key] = value
                return value

---
# Key join: orders -> products by product_id
apiVersion: kaspr.io/v1alpha1
kind: KasprJoin
metadata:
  name: orders-products-join
  labels:
    kaspr.io/app: order-system
spec:
  description: "Join orders with products by product_id"
  leftTable: orders
  rightTable: products
  extractor:
    entrypoint: get_product_id
    python: |
      def get_product_id(order):
          return order.get("product_id")
  type: inner
  outputChannel: orders-products-joined

---
# Agent that processes the joined order+product stream
apiVersion: kaspr.io/v1alpha1
kind: KasprAgent
metadata:
  name: process-enriched-orders
  labels:
    kaspr.io/app: order-system
spec:
  description: "Processes joined order+product records from key join"
  input:
    channel:
      name: orders-products-joined
  output:
    topics:
      - name: enriched-orders
        keySelector:
          python: |
            def get_key(value):
                return value.get("order_id")
  processors:
    pipeline:
      - enrich
    init:
      python: |
        from datetime import datetime, timezone
    operations:
      - name: enrich
        map:
          entrypoint: enrich_order
          python: |
            def enrich_order(value):
                """
                value is a JoinedValue named tuple:
                  JoinedValue(left=<order>, right=<product>)
                or None: the order has no joined result any more (deleted,
                or its product is gone or changed to a missing one). The
                event's key is the order's key.
                """
                if value is None:
                    order_id = context["event"].key.decode()
                    return {"order_id": order_id, "deleted": True}
                order = value.left
                product = value.right
                return {
                    "order_id": order.get("order_id"),
                    "product_id": order.get("product_id"),
                    "quantity": order.get("quantity"),
                    "product_name": product.get("name"),
                    "unit_price": product.get("price"),
                    "total": product.get("price", 0) * order.get("quantity", 0),
                    "enriched_at": datetime.now(timezone.utc).isoformat()
                }
